<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>尊爵黑金 | 美髮學員進度追蹤</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-dark: #8e6d13;
            --gold-light: #d4af37;
            --gold-bright: #f9f295;
            --bg-black: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-gold: #c5a059;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-black);
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px; /* 優化手機寬度 */
        }

        h1 {
            text-align: center;
            color: var(--gold-light);
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--gold-dark);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        /* 呼吸發光邊框效果 */
        @keyframes borderGlow {
            0%, 100% { border-color: var(--gold-dark); box-shadow: 0 0 5px rgba(142, 109, 19, 0.2); }
            50% { border-color: var(--gold-light); box-shadow: 0 0 15px rgba(212, 175, 55, 0.5); }
        }

        .info-section, .card, #progressSummary {
            background: var(--card-bg);
            border: 1px solid var(--gold-dark);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            animation: borderGlow 6s infinite ease-in-out;
        }

        .info-row {
            margin-bottom: 15px;
        }

        .info-row label {
            display: block;
            color: var(--text-gold);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .info-row input {
            width: 100%;
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }

        .card h3 {
            color: var(--gold-light);
            margin-top: 0;
            font-size: 1.1rem;
        }

        .card p {
            font-size: 0.9rem;
            color: #bbb;
            line-height: 1.5;
        }

        /* 按鈕 4 秒金屬光澤週期 */
        @keyframes goldCycle {
            0%, 100% { background: var(--gold-dark); color: #000; }
            50% { background: var(--gold-bright); color: #000; box-shadow: 0 0 10px var(--gold-bright); }
        }

        .btn-gold {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            animation: goldCycle 4s infinite ease-in-out;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .status-btn {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #252525;
            color: #888;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .status-btn.active-complete {
            border-color: var(--gold-light);
            color: var(--gold-light);
            background: rgba(212, 175, 55, 0.1);
        }

        textarea {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #ccc;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .footer-action {
            position: sticky;
            bottom: 20px;
            display: flex;
            gap: 10px;
        }

        #saveBtn { flex: 2; }
        #clearBtn { 
            flex: 1; 
            background: #333; 
            color: #888; 
            border: 1px solid #444;
            animation: none;
        }

        .highlight-gold { color: var(--gold-light); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Elite Hair Stylist</h1>

    <div class="info-section">
        <div class="info-row">
            <label>學員姓名 Student Name</label>
            <input type="text" id="studentName" placeholder="輸入姓名">
        </div>
        <div class="info-row">
            <label>課程名稱 Course</label>
            <input type="text" id="courseName" placeholder="輸入課程內容">
        </div>
    </div>

    <div id="checkpoints">
        <div class="card" data-id="1">
            <h3>關卡 1：基礎知識的探索者</h3>
            <p>任務：能說出或寫出五種以上今天所學的專業名詞或技法。</p>
            <div class="status-grid">
                <button class="status-btn" id="btn-1-incomplete" onclick="setStatus(1, '未完成')">未完成</button>
                <button class="status-btn" id="btn-1-complete" onclick="setStatus(1, '已完成')">已完成</button>
            </div>
            <textarea id="comment1" placeholder="留給未來的自己一些評語..."></textarea>
        </div>
        </div>

    <div id="progressSummary">
        <h3 style="text-align: center;">進度摘要 Report</h3>
        <p>學員：<span id="summaryName" class="highlight-gold">-</span></p>
        <p>進度：<span id="progressText" class="highlight-gold">0/10</span></p>
    </div>

    <div class="footer-action">
        <button id="clearBtn" class="status-btn" onclick="clearData()">還原</button>
        <button id="saveBtn" class="btn-gold" onclick="saveToFirebase()">儲存雲端進度</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

<script>
    // --- Firebase 配置 (請替換為你的 Firebase Console 資訊) ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_ID",
        appId: "YOUR_APP_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let checkpointStatus = {};

    function setStatus(id, status) {
        if(!checkpointStatus[id]) checkpointStatus[id] = {};
        checkpointStatus[id].status = status;
        
        // 更新 UI
        document.getElementById(`btn-${id}-incomplete`).classList.toggle('active-complete', status === '未完成');
        document.getElementById(`btn-${id}-complete`).classList.toggle('active-complete', status === '已完成');
        updateSummary();
    }

    function updateSummary() {
        const name = document.getElementById('studentName').value;
        let completed = 0;
        for(let i in checkpointStatus) {
            if(checkpointStatus[i].status === '已完成') completed++;
        }
        document.getElementById('summaryName').innerText = name || '-';
        document.getElementById('progressText').innerText = `${completed}/10`;
    }

    function saveToFirebase() {
        const name = document.getElementById('studentName').value;
        if(!name) return alert('請輸入姓名以利雲端備份');

        const data = {
            name: name,
            course: document.getElementById('courseName').value,
            progress: checkpointStatus,
            lastUpdated: new Date().toISOString()
        };

        db.ref('students/' + name).set(data)
          .then(() => alert('雲端儲存成功！'))
          .catch(err => alert('失敗：' + err.message));
    }

    function clearData() {
        if(confirm('確定清除嗎？')) location.reload();
    }
</script>
</body>
</html>
