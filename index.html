<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Stylist | 管理系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-dark: #8e6d13;
            --gold-main: #d4af37;
            --gold-bright: #f9f295;
            --bg-black: #050505;
            --card-bg: rgba(30, 30, 30, 0.7);
            --glass-border: rgba(212, 175, 55, 0.3);
        }

        body { font-family: 'Noto Sans TC', sans-serif; background: radial-gradient(circle at top, #1a1a1a 0%, #050505 100%); color: #e0e0e0; margin: 0; padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; }

        /* 導航列 */
        .nav-tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #222; }
        .nav-btn { background: none; border: none; color: #555; font-size: 0.9rem; cursor: pointer; padding: 12px; transition: 0.3s; letter-spacing: 2px; }
        .nav-btn.active { color: var(--gold-main); border-bottom: 2px solid var(--gold-main); font-weight: bold; }

        h1 { text-align: center; font-family: 'Noto Serif TC', serif; background: linear-gradient(to bottom, var(--gold-bright) 0%, var(--gold-main) 50%, var(--gold-dark) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; letter-spacing: 4px; margin: 15px 0; filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.3)); }

        .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 20px; }

        /* 密碼鎖定層 */
        #passwordLayer { text-align: center; padding: 40px 20px; }
        .pw-input { background: #000; border: 1px solid var(--gold-dark); color: var(--gold-bright); font-size: 1.5rem; text-align: center; width: 150px; padding: 10px; border-radius: 10px; letter-spacing: 5px; margin: 20px 0; outline: none; }
        .unlock-btn { background: var(--gold-main); color: #000; border: none; padding: 10px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* 學員端樣式 */
        .info-row label { color: var(--gold-main); font-size: 0.75rem; display: block; margin-bottom: 5px; }
        .info-row input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #444; color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 12px; box-sizing: border-box; outline: none; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .status-btn { padding: 10px 5px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #666; font-size: 0.75rem; cursor: pointer; }
        .status-btn.active-com { border-color: #5cb85c; color: #5cb85c; background: rgba(92, 184, 92, 0.1); }
        .status-btn.active-inc { border-color: #d9534f; color: #d9534f; background: rgba(217, 83, 79, 0.1); }
        textarea { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #444; color: #eee; border-radius: 10px; padding: 10px; margin-top: 10px; box-sizing: border-box; display: none; height: 80px; resize: none; font-size: 0.85rem; }

        /* 進度條 */
        .progress-bg { width: 100%; height: 8px; background: #111; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold-bright)); transition: width 0.8s ease; }

        /* 導師清單 */
        .student-list-card { border-bottom: 1px solid #333; padding: 15px 0; margin-bottom: 10px; }
        .student-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .student-name { font-size: 1.1rem; color: var(--gold-main); font-weight: bold; }
        .course-tag { font-size: 0.7rem; color: #888; border: 1px solid #444; padding: 2px 6px; border-radius: 4px; }
        .task-dots { display: flex; gap: 4px; margin-top: 8px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #222; border: 1px solid #444; }
        .dot.done { background: var(--gold-main); box-shadow: 0 0 5px var(--gold-main); border: none; }
        .mentor-comments { font-size: 0.8rem; color: #aaa; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-top: 10px; line-height: 1.5; }
        .q-tag { color: var(--gold-dark); font-weight: bold; margin-right: 5px; }

        /* 底部按鈕 */
        .footer-action { position: sticky; bottom: 20px; display: flex; gap: 10px; padding: 15px 0; background: rgba(5,5,5,0.8); backdrop-filter: blur(5px); z-index: 100; }
        #saveBtn { flex: 1; height: 50px; border: none; border-radius: 12px; font-weight: bold; background: linear-gradient(45deg, var(--gold-dark), var(--gold-bright)); color: #000; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-tabs">
        <button class="nav-btn active" id="tabStudent" onclick="switchView('student')">學員模式</button>
        <button class="nav-btn" id="tabMentor" onclick="switchView('mentor')">導師管理</button>
    </div>

    <h1>ELITE STATUS</h1>

    <div id="studentView">
        <div class="glass-card">
            <div class="info-row">
                <label>STUDENT NAME</label>
                <input type="text" id="studentName" placeholder="請輸入姓名...">
                <label>COURSE</label>
                <input type="text" id="courseName" placeholder="輸入目前課程...">
            </div>
        </div>
        <div id="cardsContainer"></div>
        <div class="glass-card">
            <h3 style="color:var(--gold-main); font-size:0.8rem; text-align:center; letter-spacing:2px;">PROGRESS SUMMARY</h3>
            <div class="progress-bg"><div id="mainProgressBar" class="progress-fill"></div></div>
            <p style="text-align:right; font-size:0.8rem; margin:0;" id="sumProgress">0 / 10</p>
        </div>
        <div class="footer-action">
            <button id="saveBtn" onclick="saveToFirebase()">同步至雲端系統</button>
        </div>
    </div>

    <div id="mentorView" style="display:none;">
        <div id="passwordLayer" class="glass-card">
            <p style="color:var(--gold-main)">請輸入管理密碼</p>
            <input type="password" id="mentorPassword" class="pw-input" maxlength="4" placeholder="****">
            <br>
            <button class="unlock-btn" onclick="verifyPassword()">解鎖管理介面</button>
        </div>

        <div id="mentorContent" style="display:none;">
            <div class="glass-card">
                <div id="mentorList">正在同步資料庫...</div>
            </div>
            <button onclick="fetchMentorData()" style="width:100%; background:none; border:1px solid var(--gold-dark); color:var(--gold-main); padding:12px; border-radius:10px; margin-bottom:50px;">重新整理清單</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCOhBN9TH3UJSOSx5XVyQ08f_2RUckvXYU",
        authDomain: "holyhairsalon-f73bf.firebaseapp.com",
        databaseURL: "https://holyhairsalon-f73bf-default-rtdb.firebaseio.com",
        projectId: "holyhairsalon-f73bf",
        storageBucket: "holyhairsalon-f73bf.firebasestorage.app",
        messagingSenderId: "960169055224",
        appId: "1:960169055224:web:48af64a6cf215650bf3c0d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const tasks = [
        "基礎知識探索者", "課堂上的發言者", "美髮工具掌握者", "乾淨環境維護者", "觀察與模仿實踐家",
        "有效溝通練習者", "時間管理達人", "自我評估審視者", "團隊合作助攻者", "專業習慣養成者"
    ];

    let scores = {};
    let isMentorUnlocked = false;

    // --- 切換邏輯 ---
    function switchView(view) {
        document.getElementById('studentView').style.display = view === 'student' ? 'block' : 'none';
        document.getElementById('mentorView').style.display = view === 'mentor' ? 'block' : 'none';
        document.getElementById('tabStudent').classList.toggle('active', view === 'student');
        document.getElementById('tabMentor').classList.toggle('active', view === 'mentor');

        if(view === 'mentor' && isMentorUnlocked) {
            fetchMentorData();
        } else if(view === 'mentor') {
            document.getElementById('passwordLayer').style.display = 'block';
            document.getElementById('mentorContent').style.display = 'none';
        }
    }

    // --- 密碼驗證 ---
    function verifyPassword() {
        const pw = document.getElementById('mentorPassword').value;
        if(pw === "0000") {
            isMentorUnlocked = true;
            document.getElementById('passwordLayer').style.display = 'none';
            document.getElementById('mentorContent').style.display = 'block';
            fetchMentorData();
        } else {
            alert("密碼錯誤，請重新輸入");
            document.getElementById('mentorPassword').value = "";
        }
    }

    // --- 學員邏輯 ---
    function initStudent() {
        const local = JSON.parse(localStorage.getItem('elite_salon_data')) || {};
        document.getElementById('studentName').value = local.name || "";
        document.getElementById('courseName').value = local.course || "";
        const container = document.getElementById('cardsContainer');
        container.innerHTML = "";
        tasks.forEach((task, i) => {
            const id = i + 1;
            scores[id] = (local.data && local.data[id]) ? local.data[id] : { status: '未完成', comment: '' };
            container.innerHTML += `
                <div class="glass-card">
                    <h3 style="font-size:0.95rem; color:var(--gold-main); margin-bottom:15px;">關卡 ${id}: ${task}</h3>
                    <div class="status-grid">
                        <button class="status-btn" id="inc-${id}" onclick="updateStatus(${id}, '未完成')">未完成</button>
                        <button class="status-btn" id="com-${id}" onclick="updateStatus(${id}, '已完成')">已完成</button>
                        <button class="status-btn" id="tog-${id}" onclick="toggleMsg(${id})">留言</button>
                    </div>
                    <textarea id="msg-${id}" oninput="updateComment(${id})">${scores[id].comment}</textarea>
                </div>`;
            setTimeout(() => {
                document.getElementById(`inc-${id}`).classList.toggle('active-inc', scores[id].status === '未完成');
                document.getElementById(`com-${id}`).classList.toggle('active-com', scores[id].status === '已完成');
                if(scores[id].comment) document.getElementById(`msg-${id}`).style.display = 'block';
            }, 50);
        });
        updateProgressBar();
    }

    function updateStatus(id, status) {
        scores[id].status = status;
        document.getElementById(`inc-${id}`).classList.toggle('active-inc', status === '未完成');
        document.getElementById(`com-${id}`).classList.toggle('active-com', status === '已完成');
        updateProgressBar();
        saveLocal();
    }

    function toggleMsg(id) {
        const el = document.getElementById(`msg-${id}`);
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function updateComment(id) {
        scores[id].comment = document.getElementById(`msg-${id}`).value;
        saveLocal();
    }

    function updateProgressBar() {
        const done = Object.values(scores).filter(s => s.status === '已完成').length;
        document.getElementById('mainProgressBar').style.width = (done * 10) + '%';
        document.getElementById('sumProgress').innerText = `${done} / 10`;
    }

    function saveLocal() {
        localStorage.setItem('elite_salon_data', JSON.stringify({
            name: document.getElementById('studentName').value,
            course: document.getElementById('courseName').value,
            data: scores
        }));
    }

    function saveToFirebase() {
        const name = document.getElementById('studentName').value;
        if(!name) return alert("請輸入學員姓名以利存檔");
        db.ref('students/' + name).set({
            name: name,
            course: document.getElementById('courseName').value,
            data: scores,
            time: new Date().toLocaleString()
        }).then(() => alert("✨ 雲端同步完成 ✨"));
    }

    // --- 導師讀取邏輯 ---
    function fetchMentorData() {
        const listDiv = document.getElementById('mentorList');
        listDiv.innerHTML = "同步數據中...";
        db.ref('students').once('value', (snapshot) => {
            listDiv.innerHTML = "";
            const data = snapshot.val();
            if(!data) { listDiv.innerHTML = "尚無學員數據"; return; }
            
            for(let key in data) {
                const s = data[key];
                const doneCount = Object.values(s.data).filter(v => v.status === '已完成').length;
                let commentItems = "";
                for(let id in s.data) {
                    if(s.data[id].comment) {
                        commentItems += `<div><span class="q-tag">Q${id}:</span>${s.data[id].comment}</div>`;
                    }
                }

                listDiv.innerHTML += `
                    <div class="student-list-card">
                        <div class="student-header">
                            <span class="student-name">${s.name}</span>
                            <span class="course-tag">${s.course || '一般課程'}</span>
                        </div>
                        <div class="progress-bg"><div class="progress-fill" style="width:${doneCount*10}%"></div></div>
                        <div class="task-dots">
                            ${Object.values(s.data).map(v => `<div class="dot ${v.status === '已完成' ? 'done' : ''}"></div>`).join('')}
                        </div>
                        ${commentItems ? `<div class="mentor-comments">${commentItems}</div>` : ''}
                    </div>
                `;
            }
        });
    }

    window.onload = initStudent;
</script>
</body>
</html>
